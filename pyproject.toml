# Only for the live demo of the showcase site (api/index.py on Vercel): what that one function needs.
# The tools' own Python packages stay in requirements.txt, which setup.py reads; this file is not how Strata is installed.
[project]
name = "strata-xeno-demo"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.117.1",
  "jinja2==3.1.6",
  "psutil==7.2.2",
]

[tool.vercel]
entrypoint = "api.index:app"
