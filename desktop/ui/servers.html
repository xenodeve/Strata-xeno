<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src data:; script-src 'unsafe-inline' 'unsafe-eval'">
<title>Strata Desktop</title>
<style>
  /* #332: the web app's design language (serve/ui/src/styles.css): near-monochrome ink on neutral surfaces, every level the
     ink mixed into the surface; Inter and Anuphan (inlined by gui.servers_html), JetBrains Mono; a page head, sections divided
     by a rule, rows that wash on hover, buttons in ink / fill / quiet; one ease; Thai never tracked. */
  /*FONTS*/
  :root {
    color-scheme: light;
    --bg: #f5f5f7; --surface: #ffffff; --ink: #131316; --accent: #0a62d6; --ok: #1a8a4a; --bad: #c6322b; --wait: #b87400;
    --ease: cubic-bezier(0.23, 1, 0.32, 1);
    --r-1: 8px; --r-2: 12px; --r-3: 16px;
    --font-sans: -apple-system, "SF Pro Text", "SF Thai", "Inter Variable", "Anuphan Variable", system-ui, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono Variable", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --bg: #0b0b0d; --surface: #151518; --ink: #f1f1f3; --accent: #5aa2ff; --ok: #4cc380; --bad: #ff7a70; --wait: #f0b44c; }
  }
  :root {
    --ink-2: color-mix(in srgb, var(--ink) 62%, var(--surface));
    --ink-3: color-mix(in srgb, var(--ink) 40%, var(--surface));
    --hover: color-mix(in srgb, var(--ink) 8%, transparent);
    --fill: color-mix(in srgb, var(--ink) 12%, transparent);
    --fill-2: color-mix(in srgb, var(--ink) 18%, transparent);
    --line: color-mix(in srgb, var(--ink) 11%, transparent);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; padding: 28px 24px 24px; background: var(--bg); color: var(--ink);
    font: 400 14px/1.5 var(--font-sans); letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  main { max-width: 640px; margin: 0 auto; animation: sharpen 260ms var(--ease) backwards; }
  @keyframes sharpen { from { opacity: 0; filter: blur(6px); transform: scale(0.985); } to { opacity: 1; filter: none; transform: none; } }
  ::selection { background: color-mix(in srgb, var(--accent) 28%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-1); }
  * { scrollbar-width: thin; scrollbar-color: var(--fill-2) transparent; }

  /* The page head: the title at a confident size, the connection as its one quiet line */
  .page-title { font-size: 26px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 600; margin: 0; text-wrap: balance; }
  .state { display: flex; gap: 8px; align-items: baseline; margin-top: 0.55rem; color: var(--ink-2); font-size: 14px; }
  .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); transform: translateY(-1px); }
  .dot.online { background: var(--ok); }
  .dot.connecting, .dot.pending, .dot.offline { background: var(--wait); animation: pulse 1.4s ease-in-out infinite; }
  .dot.refused, .dot.error { background: var(--bad); }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .notice { color: var(--bad); font-size: 12.5px; margin-top: 6px; }

  /* The device code: the one figure that matters while the owner decides */
  #pending { margin-top: 18px; padding: 16px; border-radius: var(--r-2); background: var(--hover); }
  .code { font: 600 32px/1.1 var(--font-mono); letter-spacing: 0.14em; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .copied { color: var(--ink-2); font-size: 12.5px; margin-left: 6px; }

  /* Sections: a rule above, a heading, then rows */
  section { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
  h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 8px; line-height: 1.25; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.server {
    padding: 12px 10px; margin: 0 -10px; border-radius: var(--r-1); cursor: pointer;
    transition: background-color 180ms var(--ease);
  }
  li.server + li.server { margin-top: 2px; }
  li.server:hover { background: var(--hover); }
  li.server.selected { background: var(--fill); }
  .name { font-weight: 600; font-size: 14px; }
  .muted { color: var(--ink-2); font-size: 12.5px; word-break: break-all; }
  li.server .muted:nth-child(2) { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0; }
  .result { font-size: 12.5px; margin-top: 4px; color: var(--ink-2); }
  .result.bad { color: var(--bad); }
  .empty { color: var(--ink-2); font-size: 13px; margin: 4px 0 0; }

  /* Fields and buttons, as the web app's inputCls and Button */
  label { display: block; font-size: 12.5px; color: var(--ink-2); margin: 12px 0 5px; }
  input {
    width: 100%; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-1); font: inherit; font-size: 13px;
    background: var(--surface); color: var(--ink); outline: none; caret-color: var(--accent); transition: border-color 150ms;
  }
  input::placeholder { color: var(--ink-3); }
  input:hover { border-color: var(--fill-2); }
  input:focus { border-color: var(--accent); }
  .row-actions, .form-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  li.server .row-actions button.danger { margin-left: auto; }
  .form-actions { margin-top: 16px; }
  button {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 0; border-radius: var(--r-1); font: inherit; font-size: 13px; font-weight: 500; letter-spacing: -0.01em;
    background: var(--fill); color: var(--ink); cursor: pointer; transition: background-color 150ms, opacity 150ms, transform 150ms;
  }
  button:hover { background: var(--fill-2); }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.4; pointer-events: none; }
  button.primary { background: var(--ink); color: var(--surface); }
  button.primary:hover { opacity: 0.9; background: var(--ink); }
  button.quiet { background: transparent; color: var(--ink-2); }
  button.quiet:hover { background: var(--hover); color: var(--ink); }
  button.danger { background: transparent; color: var(--bad); }
  button.danger:hover { background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .warn {
    background: color-mix(in srgb, var(--wait) 14%, transparent); color: var(--ink); border-radius: var(--r-1);
    padding: 8px 10px; font-size: 12.5px; margin-top: 8px;
  }
  .error { color: var(--bad); font-size: 12.5px; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
  .note { font-size: 12px; color: var(--ink-3); margin: 24px 0 0; }
  [hidden] { display: none !important; }

  /* Thai: marks stack above and below the line - no tracking, and room in every tight line */
  html:lang(th) * { letter-spacing: 0 !important; }
  html:lang(th) .page-title, html:lang(th) h2 { line-height: 1.35; }
  html:lang(th) .state { line-height: 1.7; }
  html:lang(th) .code { letter-spacing: 0.14em !important; }      /* the code is Latin: it keeps its spacing */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<main>
<header id="state-panel">
  <h1 class="page-title" id="title"></h1>
  <div class="state"><span class="dot" id="dot"></span><span id="state-text"></span></div>
  <div class="notice" id="notice" role="status" hidden></div>
  <div id="pending" hidden>
    <div class="code" id="code"></div>
    <button id="copy" type="button"></button><span class="copied" id="copied" hidden></span>
  </div>
  <div class="row-actions" id="without-row" hidden><button class="quiet" id="without" type="button"></button></div>
</header>

<section>
  <h2 id="servers-title"></h2>
  <ul id="servers"></ul>
  <p class="empty" id="empty" hidden></p>
</section>

<section>
  <h2 id="form-title"></h2>
  <form id="form" autocomplete="off">
    <label for="f-name" id="l-name"></label>
    <input id="f-name" maxlength="64" spellcheck="false">
    <label for="f-url" id="l-url"></label>
    <input id="f-url" spellcheck="false" placeholder="https://">
    <div class="warn" id="warning" hidden></div>
    <label for="f-token" id="l-token"></label>
    <input id="f-token" type="password" spellcheck="false">
    <div class="hint" id="token-hint" hidden></div>
    <div class="error" id="form-error" hidden></div>
    <div class="form-actions">
      <button class="primary" id="save" type="submit"></button>
      <button class="quiet" id="new" type="button"></button>
      <button class="danger" id="remove" type="button" hidden></button>
    </div>
  </form>
</section>
<p class="note" id="kept"></p>
</main>

<script>
"use strict";
const WORDS = /*WORDS*/{};
function w(key, fields) {
  let s = WORDS[key] || key;
  for (const k in (fields || {})) s = s.split("{" + k + "}").join(String(fields[k]));
  return s;
}
const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = String(text);
  return e;
}

let api = null;
let editing = null;          // the name of the server in the form, or null for a new one
let selected = null;
const results = {};          // name -> the last test's result (this window only)

function busy(on) {
  for (const b of document.querySelectorAll("button")) b.disabled = on;
}
async function call(fn) {
  busy(true);
  try { return await fn(); } catch (e) { return { error: w("internal_error") }; } finally { busy(false); }
}

function resultLine(name, server) {
  const r = results[name];
  if (!r) return null;
  if (r.error) return el("div", "result bad", r.error);
  const parts = [];
  if (r.pending_code) parts.push(w("pending", { server: server, code: r.pending_code }));
  else if (r.reachable) parts.push(w("test_reachable"));
  if (r.model) parts.push(w("label_model") + ": " + r.model);
  if (r.role) parts.push(w(r.role === "owner" ? "role_owner" : "role_guest"));
  if (r.reachable && !r.engine_running) parts.push(w("engine_down"));
  return el("div", "result", parts.join(" · "));
}

function renderList(servers) {
  const ul = $("servers");
  ul.replaceChildren();
  $("empty").hidden = servers.length > 0;
  for (const s of servers) {
    const li = el("li", "server" + (s.name === selected ? " selected" : ""));
    li.append(el("div", "name", s.name), el("div", "muted", s.url),
              el("div", "muted", w(s.token === "set" ? "token_set" : s.token === "unreadable" ? "token_unreadable" : "token_missing")));
    const line = resultLine(s.name, s.name);
    if (line) li.append(line);
    const actions = el("div", "row-actions");
    const test = el("button", "", w("button_test"));
    test.type = "button";
    test.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      results[s.name] = await call(() => api.test(s.name));
      refresh();
    });
    const connect = el("button", "primary", w("button_connect"));
    connect.type = "button";
    connect.addEventListener("click", async (ev) => {
      ev.stopPropagation();
      const r = await call(() => api.connect(s.name));
      if (r && r.error) results[s.name] = { error: r.error };
      refresh();
    });
    const remove = el("button", "danger", w("button_remove"));         // #332: remove it from the list, not only from the form
    remove.type = "button";
    remove.addEventListener("click", (ev) => { ev.stopPropagation(); removeServer(s.name); });
    actions.append(test, connect, remove);
    li.append(actions);
    li.addEventListener("click", () => edit(s));
    ul.append(li);
  }
}

async function removeServer(name) {
  if (!window.confirm(w("confirm_remove", { name: name }))) return;
  const r = await call(() => api.remove(name));
  if (r && r.error) { $("form-error").textContent = r.error; $("form-error").hidden = false; return; }
  delete results[name];
  if (editing === name || selected === name) edit(null);
  refresh();
}

function edit(s) {
  selected = s ? s.name : null;
  editing = s ? s.name : null;
  $("form-title").textContent = s ? s.name : w("button_new");
  $("f-name").value = s ? s.name : "";
  $("f-url").value = s ? s.url : "";
  $("f-token").value = "";                       // the token is never put back into the form
  $("token-hint").hidden = !s;
  $("remove").hidden = !s;
  $("form-error").hidden = true;
  checkUrl();
  for (const li of document.querySelectorAll("li.server")) li.classList.toggle("selected", !!s && li.firstChild.textContent === s.name);
}

let warnTimer = 0;
function checkUrl() {
  clearTimeout(warnTimer);
  warnTimer = setTimeout(async () => {
    if (!api) return;
    let text = null;
    try { text = await api.warning($("f-url").value); } catch (e) { text = null; }
    $("warning").textContent = text || "";
    $("warning").hidden = !text;
  }, 150);
}

async function refresh() {
  if (!api) return;
  let r;
  try { r = await api.list(); } catch (e) { r = { error: w("internal_error") }; }
  if (!r || r.error) { $("form-error").textContent = (r && r.error) || w("internal_error"); $("form-error").hidden = false; return; }
  if (selected === null && r.last) selected = r.last;
  renderList(r.servers || []);
  if (r.state) window.render(r.state);
}

window.render = function (st) {
  if (!st) return;
  $("dot").className = "dot " + (st.kind || "idle");
  $("state-text").textContent = st.text || "";
  $("notice").textContent = st.notice || "";
  $("notice").hidden = !st.notice;
  const pending = st.kind === "pending" && !!st.code;
  $("pending").hidden = !pending;
  $("code").textContent = pending ? st.code : "";
  $("without-row").hidden = !st.can_open_without_runner;
};

function init() {
  if (api) return;
  api = window.pywebview.api;
  refresh();
}

document.addEventListener("DOMContentLoaded", () => {
  $("title").textContent = w("servers_title");
  $("servers-title").textContent = w("servers_heading");
  $("l-name").textContent = w("label_name");
  $("l-url").textContent = w("label_url");
  $("l-token").textContent = w("label_token");
  $("token-hint").textContent = w("token_keep");
  $("save").textContent = w("button_save");
  $("remove").textContent = w("button_remove");
  $("new").textContent = w("button_new");
  $("copy").textContent = w("menu_copy_code");
  $("copied").textContent = w("copied");
  $("without").textContent = w("button_open_without_runner");
  $("empty").textContent = w("servers_empty");
  $("kept").textContent = w("token_kept");
  edit(null);

  $("f-url").addEventListener("input", checkUrl);
  $("new").addEventListener("click", () => edit(null));
  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const name = $("f-name").value, url = $("f-url").value, token = $("f-token").value;
    const r = await call(() => api.save(name, url, token || null, editing));
    if (r && r.ok) {
      $("f-token").value = "";
      selected = editing = name.trim();
      $("form-title").textContent = editing;
      $("token-hint").hidden = false;
      $("remove").hidden = false;
      $("form-error").hidden = true;
      refresh();
    } else {
      $("form-error").textContent = (r && r.error) || w("internal_error");
      $("form-error").hidden = false;
    }
  });
  $("remove").addEventListener("click", () => { if (editing) removeServer(editing); });
  $("copy").addEventListener("click", async () => {
    const r = await call(() => api.copy_code());
    $("copied").hidden = !(r && r.ok);
    setTimeout(() => { $("copied").hidden = true; }, 2000);
  });
  $("without").addEventListener("click", () => call(() => api.open_without_runner()));

  if (window.pywebview && window.pywebview.api && window.pywebview.api.list) init();
});
window.addEventListener("pywebviewready", init);
</script>
</body>
</html>
